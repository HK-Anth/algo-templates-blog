name: Deploy VitePress site to Pages

on:
  # 推送到 main 分支时自动构建并部署
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署到 GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 依赖 git 提交时间，必须拉取完整历史
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # ⚠️ 必须带 --no-package-lock，否则构建会以「0 秒失败」的方式挂掉。
        #
        # 原因：仓库里的 package-lock.json 是在 Windows 上生成的，其 packages 字段只固化了
        # win32 平台的可选原生依赖（@rollup/rollup-win32-x64-msvc、@esbuild/win32-x64）。
        # 虽然 optionalDependencies 里声明了全部 25 个 rollup 平台包，但 packages 里只写入了 1 个。
        # npm 在存在锁文件时以锁文件为准，不会为 Ubuntu 补装 @rollup/rollup-linux-x64-gnu，
        # 于是 `vitepress build` 一加载 rollup 就抛
        #   Error: Cannot find module @rollup/rollup-linux-x64-gnu
        # 进程瞬间退出（日志里表现为 Build 步骤耗时 0 秒、退出码 1）。
        # 这是 npm 的已知问题（npm/cli#4828）。--no-package-lock 让 npm 忽略锁文件、
        # 按当前平台重新解析依赖，从而装上正确的原生包。
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Ensure native modules
        # 双保险 + 前置自检：
        # 1) 按当前已安装的 rollup / esbuild 版本，精确补装对应的 Linux 原生包，
        #    即使上一步的 --no-package-lock 没生效也能救回来；
        # 2) 用 node 实际加载一次做验证，缺失时在这里就给出明确报错，
        #    而不是让构建步骤以「0 秒失败」这种没有信息量的方式挂掉。
        run: |
          ROLLUP_V=$(node -p "require('rollup/package.json').version")
          ESBUILD_V=$(node -p "require('esbuild/package.json').version")
          echo "rollup=$ROLLUP_V esbuild=$ESBUILD_V"
          npm install --no-save --no-package-lock --no-audit --no-fund \
            "@rollup/rollup-linux-x64-gnu@$ROLLUP_V" \
            "@esbuild/linux-x64@$ESBUILD_V"
          node -e "console.log('rollup  native ok:', require('@rollup/rollup-linux-x64-gnu/package.json').version)"
          node -e "console.log('esbuild native ok:', require('@esbuild/linux-x64/package.json').version)"

      - name: Build with VitePress
        # 项目页部署在 https://<user>.github.io/<repo>/ 下，必须注入 base
        # 若使用自定义域名或用户主页（<user>.github.io），删除下面两行 env
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
